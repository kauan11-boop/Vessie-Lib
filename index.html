<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover: usa a tela toda em aparelhos com notch (o CSS respeita as áreas seguras)
     interactive-widget=resizes-content: o teclado virtual redimensiona a página (Android/Chrome) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f0e0c">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forja">
<title>Forja — chat para LM Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231b1815'/%3E%3Cpath d='M12 3c.5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6z' fill='%23e08a3c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app">

  <!-- ======== SIDEBAR ======== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><span data-icon="flame"></span></div>
      <div>
        <div class="brand-name">Forja</div>
        <div class="brand-sub">LM Studio Console</div>
      </div>
    </div>
    <button class="new-chat" id="newChat"></button>
    <div class="chat-list" id="chatList"></div>
    <div class="sidebar-foot">
      <button class="side-btn" id="openSettings"></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- ======== ÁREA PRINCIPAL ======== -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" title="Conversas"></button>
      <div class="topbar-title" id="chatTitle" title="Clique para renomear"></div>
      <div class="topbar-right">
        <button class="conn" id="connPill"><span class="conn-dot checking" id="connDot"></span><span id="connText">verificando…</span></button>
        <button class="icon-btn" id="exportBtn" title="Exportar conversa (.md)"></button>
        <button class="icon-btn" id="clearBtn" title="Limpar mensagens"></button>
      </div>
    </header>

    <div class="scroller" id="scroller">
      <div class="msg-list" id="msgList"></div>
    </div>
    <button class="scroll-down" id="scrollDown" title="Ir para o fim"></button>

    <div class="composer">
      <div class="composer-inner">
        <div class="input-wrap">
          <textarea id="input" rows="1" placeholder="Escreva sua mensagem para o modelo local…"></textarea>
          <button class="send-btn" id="sendBtn" title="Enviar"></button>
        </div>
        <div class="composer-foot">
          <span id="counter"></span>
          <span class="foot-model" id="footModel"></span>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ======== MODAL DE CONFIGURAÇÕES ======== -->
<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3>Configurações</h3>
      <button class="icon-btn" id="setClose" title="Fechar"></button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="setUrl">URL base da API</label>
        <input type="text" id="setUrl" spellcheck="false">
        <div class="hint">Padrão do LM Studio: <code>http://localhost:1234/v1</code></div>
      </div>
      <div class="field">
        <label for="setModel">Modelo</label>
        <div class="model-row">
          <input type="text" id="setModel" list="modelList" placeholder="carregue a lista ou digite o id" spellcheck="false">
          <button class="btn" id="setRefresh" title="Recarregar modelos do servidor"></button>
        </div>
        <datalist id="modelList"></datalist>
      </div>
      <div class="field">
        <label for="setSystem">Prompt de sistema</label>
        <textarea id="setSystem" rows="3" placeholder="Você é um assistente útil, direto e objetivo…"></textarea>
      </div>
      <div class="row2">
        <div class="field">
          <div class="param-top"><label for="setTemp">Temperatura</label><span class="param-val" id="tempVal"></span></div>
          <input type="range" id="setTemp" min="0" max="2" step="0.05">
        </div>
        <div class="field">
          <div class="param-top"><label for="setTopP">Top P</label><span class="param-val" id="topPVal"></span></div>
          <input type="range" id="setTopP" min="0" max="1" step="0.01">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="setMaxTok">Máx. de tokens na resposta</label>
          <input type="number" id="setMaxTok" step="1">
          <div class="hint">-1 = sem limite</div>
        </div>
        <div class="field">
          <label>Resposta</label>
          <label class="check"><input type="checkbox" id="setStream"><span>Streaming token a token</span></label>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="setTest"></button>
      <div class="spacer"></div>
      <button class="btn" id="setCancel">Cancelar</button>
      <button class="btn primary" id="setSave"></button>
    </div>
  </div>
</div>

<!-- ======== MODAL DE CONFIRMAÇÃO ======== -->
<div class="overlay" id="confirmOverlay">
  <div class="modal modal-sm">
    <div class="modal-head"><h3 id="cfTitle"></h3></div>
    <div class="modal-body"><p class="cf-msg" id="cfMsg"></p></div>
    <div class="modal-foot">
      <div class="spacer"></div>
      <button class="btn" id="cfCancel">Cancelar</button>
      <button class="btn danger" id="cfOk">Excluir</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="js/app.js"></script>
<script src="js/responsive.js"></script>
</body>
</html>
